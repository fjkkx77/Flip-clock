<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="翻页时钟">
    <meta name="theme-color" content="#000000">
    <title>待机显示</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <!--
      仿 iPhone「待机显示」（StandBy，iOS 17 起）。
      参照物：用户 iPhone 14 Pro 上的 15 张原生截图（2556×1179 = 852×393pt × 3）。
      下面所有尺寸、位置、颜色都以 pt 为单位，是从那批截图上逐个量出来的（量法和原始读数见 PROJECT_STATUS.md「待机显示」一节）。
      内容是一块 852×393 的「核心区」，按屏幕等比缩放后居中；画板本身铺满整个屏幕（背景、滑动的页都铺满），
      屏幕比例不是 852:393 时多出来的地方由背景填上，不再留黑边（2026-10-26 用户在电脑/Safari 上看到上下黑边）。
      竖着拿时整块转 90°（和主页「强制横屏」同一个方向），并让开顶部状态栏——竖屏时网页没法隐藏状态栏（Apple 文档只给了三种样式）。
      交互照 Apple 使用手册：左右滑切换小组件/时钟，上下滑切换样式；长按出设置（Apple 是长按进编辑）。
    -->
    <style>
        :root {
            --sans: system-ui, -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            --rounded: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        html, body { height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
        body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
               font-family: var(--sans); color: #fff; -webkit-tap-highlight-color: transparent; }

        /* --bw/--bh = 画板（整个屏幕）的尺寸，--ox/--oy = 核心区左上角，都由 fit() 实测后写入，单位是缩放前的 pt */
        #board { position: fixed; left: 0; top: 0; width: var(--bw, 852px); height: var(--bh, 393px); transform-origin: 0 0; overflow: hidden; background: #000; }
        .track { position: absolute; left: 0; top: 0; }
        .page { position: absolute; top: 0; left: 0; width: var(--bw, 852px); height: var(--bh, 393px); overflow: hidden; }
        .core { position: absolute; left: var(--ox, 0px); top: var(--oy, 0px); width: 852px; height: 393px; }
        #p-clock { left: var(--bw, 852px); }
        #clip-l { left: 0; width: calc(var(--ox, 0px) + 412px); }
        #clip-r { left: calc(var(--ox, 0px) + 430px); right: 0; }
        .spage-r { left: calc(-1 * (var(--ox, 0px) + 430px)); }
        .abs { position: absolute; left: 0; top: 0; }
        svg.layer { position: absolute; left: 0; top: 0; width: 852px; height: 393px; overflow: visible; }
        svg text { font-family: var(--sans); }

        /* ---------- 颜色：白天值是截图实测，夜间值也是（夜间截图同一批量出来的） ---------- */
        #board {
            --pri: #ffffff; --accent: #ff453a; --sec: #949496; --tick: #606060; --tick-hour: #f9f9f9; --orange: #ff9f0a;
            --sep: #333335; --today-text: #ffffff; --dot-on: #ffffff; --dot-off: #797979;
            /* 全屏指针 */
            --an-hour-tick: #b0b0b0; --an-num: #ffffff; --an-hand: #ffffff; --an-date: #ffffff; --an-wk: #ff453a; --an-sec: #ff9f0a;
            /* 数字 */
            --dg-date: #ffffff; --dg-temp: #ffffff;
            /* 世界 */
            --w-on: #cdcdcd; --w-off: #535353; --w-city: #ff9230; --w-big: #ffffff; --w-small: #ffffff; --w-arrow: #ffffff;
            --w-curve-a: #a0a0a0; --w-curve-b: #7c7c7c; --w-curve-c: #565656; --w-curve-d: #212121; --w-curve-e: #1b1b1b;
        }
        #board.night {
            --pri: #f30508; --accent: #f30508; --sec: #8a0408; --tick: #590305; --tick-hour: #f30508; --orange: #a5050f;
            --sep: #2a0204; --today-text: #000000; --dot-on: #f30508; --dot-off: #590305;
            --an-hour-tick: #ce0205; --an-num: #d10003; --an-hand: #fd0101; --an-date: #90050e; --an-wk: #b80a0f; --an-sec: #a5050f;
            --dg-date: #ca0307; --dg-temp: #9b0306;
            --w-on: #9e0002; --w-off: #5f0101; --w-city: #c90306; --w-big: #fe0101; --w-small: #9d0205; --w-arrow: #d10102;
            --w-curve-a: #ac0004; --w-curve-b: #860003; --w-curve-c: #5c0002; --w-curve-d: #240000; --w-curve-e: #1b0000;
        }

        /* ---------- 指针（HTML 块 + CSS 动画转，交给合成器，不占主线程） ---------- */
        .hand { position: absolute; width: 0; height: 0; animation: spin linear infinite; }
        .hand i { position: absolute; display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .freeze .hand, .freeze .fl { animation-play-state: paused !important; }

        /* ---------- 智能叠放的圆点（滑动时出现，停下后淡出） ---------- */
        .stack-dots { position: absolute; left: 418.7px; width: 6px; opacity: 0; transition: opacity 0.35s; pointer-events: none; }
        .stack-dots.show { opacity: 1; transition: opacity 0.15s; }
        .stack-dots b { display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--dot-off); margin-bottom: 6.3px; }
        .stack-dots b.on { background: var(--dot-on); }
        .clip { position: absolute; top: 0; height: var(--bh, 393px); overflow: hidden; }

        /* ---------- 漂浮（Float）：各位数字慢慢浮动；截图里同一个数字两次的倾斜角度不同（-1.7° / +3.6°），推断是在动 ---------- */
        .fl { position: absolute; mix-blend-mode: screen; transform-origin: 50% 50%; animation: float1 9s ease-in-out infinite alternate; }
        .fl.k2 { animation-name: float2; animation-duration: 11s; }
        .fl.k3 { animation-name: float3; animation-duration: 8s; }
        .fl.k4 { animation-name: float4; animation-duration: 10s; }
        .fl.k5 { animation-name: float2; animation-duration: 12s; }
        @keyframes float1 { from { transform: translateY(-3px) rotate(-2deg); } to { transform: translateY(4px) rotate(3deg); } }
        @keyframes float2 { from { transform: translateY(4px) rotate(4deg); } to { transform: translateY(-4px) rotate(-2deg); } }
        @keyframes float3 { from { transform: translateY(-4px) rotate(-5deg); } to { transform: translateY(3px) rotate(2deg); } }
        @keyframes float4 { from { transform: translateY(3px) rotate(5deg); } to { transform: translateY(-3px) rotate(-1deg); } }
        @media (prefers-reduced-motion: reduce) { .fl { animation: none; } }

        /* ---------- 长按出来的设置面板（照 iOS 深色分组列表） ---------- */
        #sheet { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center;
                 opacity: 0; visibility: hidden; transition: opacity 0.2s, visibility 0s 0.2s; z-index: 50; }
        #sheet.open { opacity: 1; visibility: visible; transition: opacity 0.2s; }
        .panel { width: 420px; max-height: 373px; overflow-y: auto; background: #1c1c1e; border-radius: 20px; padding: 14px 16px 16px;
                 color: #fff; font-size: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); touch-action: pan-y; }
        .panel h2 { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 10px; }
        .grp { background: #2c2c2e; border-radius: 12px; margin-bottom: 10px; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; padding: 6px 12px; }
        .row + .row { border-top: 0.5px solid rgba(84,84,88,0.65); }
        .row small { display: block; font-size: 12px; color: rgba(235,235,245,0.6); margin-top: 1px; }
        .seg { display: flex; background: rgba(118,118,128,0.24); border-radius: 9px; padding: 2px; flex: none; }
        .seg button { min-width: 52px; height: 30px; border: 0; border-radius: 7px; background: none; color: #fff; font: 500 13px var(--sans); }
        .seg button.on { background: #636366; }
        .sw { -webkit-appearance: none; appearance: none; flex: none; width: 51px; height: 31px; border-radius: 16px; background: rgba(120,120,128,0.32); position: relative; transition: background 0.2s; }
        .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.15); transition: transform 0.25s cubic-bezier(0.25,0.8,0.25,1); }
        .sw:checked { background: #30d158; } .sw:checked::after { transform: translateX(20px); }
        .swatches { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
        .swatches button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; padding: 0; background-clip: padding-box; }
        .swatches button.on { box-shadow: 0 0 0 2px #1c1c1e, 0 0 0 4px #fff; }
        .btns { display: flex; gap: 10px; }
        .btns button { flex: 1; height: 44px; border: 0; border-radius: 12px; background: #2c2c2e; color: #0a84ff; font: 600 16px var(--sans); }
        .btns button.danger { color: #ff453a; }
        .hint { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); padding: 6px 14px; border-radius: 16px; background: rgba(44,44,46,0.9);
                color: rgba(235,235,245,0.8); font-size: 13px; white-space: nowrap; opacity: 0; transition: opacity 0.4s; pointer-events: none; z-index: 40; }
        .hint.show { opacity: 1; }
    </style>
</head>
<body>
<div id="board">
    <div class="track" id="h-track">
        <!-- 第 1 页：小组件（左右两个叠放） -->
        <div class="page" id="p-widgets">
            <div class="clip" id="clip-l"><div class="track" id="stack-l"></div></div>
            <div class="clip" id="clip-r"><div class="track" id="stack-r"></div></div>
            <div class="core" style="pointer-events:none"><div class="stack-dots" id="dots-l"></div></div>
        </div>
        <!-- 第 2 页：时钟（5 种样式上下切换） -->
        <div class="page" id="p-clock">
            <div class="track" id="faces"></div>
        </div>
    </div>
    <div class="hint" id="hint"></div>
    <div id="sheet" role="dialog" aria-modal="true" aria-label="待机显示设置">
        <div class="panel" id="panel">
            <h2>待机显示</h2>
            <div class="grp">
                <div class="row"><span>夜间模式<small id="night-note">自动：<span id="night-range">22:30–6:00</span> 变红（网页拿不到环境光，用时间代替）；双击屏幕临时切换</small></span>
                    <div class="seg" id="seg-night"><button data-v="auto">自动</button><button data-v="on">打开</button><button data-v="off">关闭</button></div></div>
                <div class="row" id="row-temp"><span>显示气温<small id="temp-note">“数字”样式右上角；要用到定位</small></span><input type="checkbox" class="sw" id="sw-temp"></div>
            </div>
            <div class="grp" id="grp-color"><div class="row"><span>颜色<small id="color-note"></small></span></div><div class="swatches" id="swatches"></div></div>
            <div class="btns"><button type="button" class="danger" id="btn-exit">退出待机显示</button><button type="button" id="btn-fs">全屏</button><button type="button" id="btn-done">完成</button></div>
        </div>
    </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const W = 852, H = 393;
const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const params = new URLSearchParams(location.search);
// 测试/对照截图用：?t=2026-10-26T14:54:41 把显示的时间钉到某一刻（只影响显示），?night=1 强制夜间
const T_OFFSET = params.has('t') ? Date.parse(params.get('t')) - Date.now() : 0;
const now = () => new Date(Date.now() + T_OFFSET);
const pad2 = n => String(n).padStart(2, '0');
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const board = $('board');

/* ================= 农历（与 index.html 同一份香港天文台数据表，tests 里比对两边结果一致） ================= */
const LUNAR_TABLE = [
    0x627520,0x4cea50,0x3964a5,0x5c64b0,0x44a9b0,0x315564,0x5656a0,0x40b590,0x2b7522,0x507520,
    0x3bb256,0x60b250,0x48a4b0,0x334ab5,0x582ad0,0x4256b0,0x2cb692,0x52da90,0x3fd927,0x64e920,
    0x4cd250,0x37a4d5,0x5ca560,0x462b60,0x2f5b54,0x566d40,0x40ea90,0x2de922,0x50e920,0x3ad266,
    0x5e52b0,0x48a570,0x332b65,0x58b5a0,0x446d40,0x2eec93,0x527490,0x3d6937,0x62a930,0x4c52b0,
    0x34a5b6,0x5aaad0,0x4656a0,0x31b554,0x56ba40,0x40b490,0x2ba932,0x50a950,0x3952d7,0x5e5360,
    0x48aad0,0x355aa5,0x585b20,0x42da50,0x2fd4a3,0x54d4a0,0x3ca958,0x60a970,0x4c5560,0x36ab56,
    0x5aad50,0x466d20,0x30ea54,0x56ea50,0x4064a0,0x28c973,0x4ea9b0,0x3b55a7,0x5e56a0,0x48b690,
    0x357525,0x5ab520,0x42b250,0x2d64b4,0x52a4b0,0x3d4ab8,0x602ad0,0x4a56d0,0x36b696,0x5cda90,
    0x46d920,0x31d254,0x56d250,0x41a4da,0x64a560,0x4e2b60,0x385b56,0x5e6d50,0x48ea90,0x35e925,
    0x5ae920,0x44d260,0x2ca563,0x50a570,0x3d4d68,0x6235a0,0x4a6d50,0x376c95,0x5c7490,0x466930,
    0x2f52b4,0x5452b0,0x3ea5b0,0x2b55a2,0x4e56a0,0x39b557,0x60ba40,0x4ab490,0x33a935,0x58a950,
    0x4252d0,0x2caad4,0x50ab50,0x3d5aa9,0x625d20,0x4cda50,0x37d4a6,0x5cd4a0,0x46c950,0x3152e4,
    0x545560,0x3eab50,0x2b5b22,0x506d20,0x38ea56,0x5e7250,0x4864b0,0x32c975,0x56cab0,0x4255a0,
    0x2cad63,0x52b690,0x3d752b,0x62b520,0x4cb250,0x37a4b6,0x5aa4b0,0x444ab0,0x2e55b5,0x545ad0,
    0x3eb6a0,0x2bb522,0x50d920,0x3bd257,0x5ed250,0x48a550,0x334ad5,0x584b60,0x405b50,0x2cdaa3,
    0x52ec90,0x3fe928,0x62e920,0x4cd260,0x36a566,0x5aa570,0x445560,0x2e6d54,0x547550,0x407490,
    0x28e933,0x4e6930,0x3952b7,0x5e52b0,0x46a5b0,0x3355a5,0x5856a0,0x42b650,0x2d74a4,0x52b4a0,
    0x3da958,0x62a950,0x4a52d0,0x34aad6,0x5aab50,0x465aa0,0x2eba54,0x54da50,0x40d4a0,0x2bc953,
    0x4ec960,0x3994e7,0x5e5560,0x48ab50,0x335b25,0x586d20,0x42ea50,0x2ee4a4,0x5068b0,0x3ac978,
    0x604ab0,0x4a55b0,0x34ad66,0x5ab6a0,0x467520,0x317254,0x54b450,0x3ea8b0,0x2949b2,0x4e4ab0
];
const LUNAR_MIN_YEAR = 1901, MS_PER_DAY = 86400000;
function getLunarYearInfo(ly) {
    const raw = LUNAR_TABLE[ly - LUNAR_MIN_YEAR];
    if (raw === undefined) return null;
    const leapMonth = raw & 0xF, sizeBits = (raw >> 4) & 0x1FFF, newYearOffset = (raw >> 17) & 0x3F;
    const days = [];
    for (let i = 0; i < (leapMonth ? 13 : 12); i++) days.push(((sizeBits >> i) & 1) ? 30 : 29);
    return { leapMonth, monthDays: days, newYearMs: Date.UTC(ly, 0, 1) + newYearOffset * MS_PER_DAY };
}
function solarToLunar(y, m, d) {
    const ms = Date.UTC(y, m - 1, d);
    let info = getLunarYearInfo(y);
    if (!info || ms < info.newYearMs) info = getLunarYearInfo(y - 1);
    if (!info || ms < info.newYearMs) return null;
    let offset = Math.round((ms - info.newYearMs) / MS_PER_DAY), idx = 0;
    while (idx < info.monthDays.length && offset >= info.monthDays[idx]) { offset -= info.monthDays[idx]; idx++; }
    if (idx >= info.monthDays.length) return null;
    if (!info.leapMonth || idx < info.leapMonth) return { month: idx + 1, isLeap: false, day: offset + 1 };
    if (idx === info.leapMonth) return { month: info.leapMonth, isLeap: true, day: offset + 1 };
    return { month: idx, isLeap: false, day: offset + 1 };
}
function lunarText(date) {
    const l = solarToLunar(date.getFullYear(), date.getMonth() + 1, date.getDate());
    if (!l) return '';
    const M = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
    const D = l.day === 10 ? '初十' : l.day === 20 ? '二十' : l.day === 30 ? '三十'
        : ['初','十','廿','三'][Math.floor(l.day / 10)] + '〇一二三四五六七八九'[l.day % 10];
    return (l.isLeap ? '闰' : '') + M[l.month - 1] + '月' + D;
}

/* 调休上班日（日历里数字下面那条红线）。来源：国务院办公厅关于 2025 / 2026 年部分节假日安排的通知（新华社全文）。
   2027 年的通知一般每年 11 月才发，没发之前不标——不按规律猜 */
const MAKEUP_WORKDAYS = new Set(['2025-01-26', '2025-02-08', '2025-04-27', '2025-09-28', '2025-10-11',
    '2026-01-04', '2026-02-14', '2026-02-28', '2026-05-09', '2026-09-20', '2026-10-10']);
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

/* ================= 画板适配：等比缩放，竖着拿就整块转 90° ================= */
// 画框参照和主页一样：没有浏览器界面时用 outer（iPhone 主屏幕模式下 innerHeight 会跳）
function getFrame() {
    const noUI = navigator.standalone === true || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
    if (noUI && outerWidth > 0 && outerHeight > 0) return { w: outerWidth, h: outerHeight };
    const vv = window.visualViewport;
    return vv ? { w: vv.width, h: vv.height } : { w: innerWidth, h: innerHeight };
}
// 安全区（状态栏、灵动岛、主屏指示条）用一个探针元素读 env()
const insetProbe = document.createElement('div');
insetProbe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;' +
    'padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
document.body.appendChild(insetProbe);
function safeTop() { return parseFloat(getComputedStyle(insetProbe).paddingTop) || 0; }
const view = { rot: false, s: 1, bw: W, bh: H, ox: 0, oy: 0 };
let onFit = [];
function fit() {
    const f = getFrame(), rot = f.h > f.w;
    const sw = rot ? f.h : f.w, sh = rot ? f.w : f.h;    // 屏幕在画板方向上的长、短边（CSS px）
    // 只在「竖着拿、整块转过来」时让开状态栏：它在屏幕顶上 = 画板的左边。
    // 横屏时 iPhone 不显示状态栏，灵动岛那侧原生待机显示也是照样画过去的，所以横屏不让
    const insL = rot ? safeTop() : 0;
    const s = Math.min((sw - insL) / W, sh / H);
    const bw = sw / s, bh = sh / s;
    view.rot = rot; view.s = s; view.bw = bw; view.bh = bh;
    view.ox = insL / s + (bw - insL / s - W) / 2; view.oy = (bh - H) / 2;
    const st = board.style;
    st.setProperty('--bw', bw + 'px'); st.setProperty('--bh', bh + 'px');
    st.setProperty('--ox', view.ox + 'px'); st.setProperty('--oy', view.oy + 'px');

/* ================= 时钟样式 2：指针（满屏矩形表盘：外框 49–803 × 24–369，刻度是从中心发出的 60 条射线） ================= */

   （用户 2026-10-26 电脑全屏截图）。指针长度不跟着变：手机上 1:1 不动，大屏上表盘只是外框更舒展 */
function buildAnalog(host) {

    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') hPager.go(clampIdx(hPager.idx + (e.key === 'ArrowRight' ? 1 : -1), 2));
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { const p = hPager.idx === 1 ? facePager : stackLPager; p.step(e.key === 'ArrowDown' ? 1 : -1); }
    if (e.key === 'Enter' || e.key === ' ') openSheet();
});

/* ================= 设置面板 ================= */
function openSheet() {
    document.querySelectorAll('#seg-night button').forEach(b => b.classList.toggle('on', b.dataset.v === store.get('sbNight', 'auto')));
    $('sw-temp').checked = store.get('sbTemp', '0') === '1';
    const face = hPager.idx === 1 ? FACE_ORDER[facePager.idx] : null, pal = face && PALETTES[face];
    $('grp-color').style.display = pal ? '' : 'none';
    if (pal) {
        $('color-note').textContent = '第一个是截图里的原色，其余为代用色（Apple 的可选色没有截图可对照）';
        const box = $('swatches'); box.innerHTML = '';
        pal.forEach((c, i) => {
            const b = el('button', i === colorIdx(face) ? 'on' : '', box);
            b.type = 'button'; b.setAttribute('aria-label', '颜色 ' + (i + 1));
            b.style.background = Array.isArray(c) ? `linear-gradient(135deg, ${c[0]} 50%, ${c[1]} 50%)` : typeof c === 'number'
                ? `linear-gradient(90deg, rgb(89,62,93), rgb(201,142,210))` : c;
            if (typeof c === 'number') b.style.filter = c ? `hue-rotate(${c}deg)` : '';
            b.addEventListener('click', () => { store.set('sbColor_' + face, i); refresh(); box.querySelectorAll('button').forEach((x, n) => x.classList.toggle('on', n === i)); });
        });
    }
    sheet.classList.add('open');
}
function closeSheet() { sheet.classList.remove('open'); }
document.querySelectorAll('#seg-night button').forEach(b => b.addEventListener('click', () => {
    store.set('sbNight', b.dataset.v); store.set('sbNightOverride', 'null');   // 在设置里选过，就不再带着双击的临时切换
    document.querySelectorAll('#seg-night button').forEach(x => x.classList.toggle('on', x === b));
    refresh();
}));
$('sw-temp').addEventListener('change', e => { store.set('sbTemp', e.target.checked ? '1' : '0'); if (e.target.checked) weather.load(true); else refresh(); });
$('btn-done').addEventListener('click', closeSheet);
$('btn-exit').addEventListener('click', () => exitStandby());
sheet.addEventListener('pointerdown', e => { if (e.target === sheet) closeSheet(); });

/* ================= 进出：iPhone 是横放就进、竖起来就退；网页里只在「横着进来的」情况下竖起来才退
   （竖着进来说明开了竖排方向锁定，画面本来就是转过来的，竖着是正常状态，不能一进来就退出） ================= */
function exitStandby() { location.href = './'; }
const enteredLandscape = !view.rot;
window.addEventListener('resize', () => { if (enteredLandscape && view.rot && !sheetOpen()) exitStandby(); });
let hintTimer = 0;
function hint(msg, ms) { const h = $('hint'); h.textContent = msg; h.classList.add('show'); clearTimeout(hintTimer); hintTimer = setTimeout(() => h.classList.remove('show'), ms); }

/* ================= 沉浸：电脑/iPad 能真全屏（浏览器的标签栏、地址栏都没了），iPhone 不行 =================
   iPhone：元素全屏只有 iPad 有（MDN 兼容数据）；manifest 的 display: fullscreen iOS 也不认，只认 standalone。
   竖屏时状态栏网页隐藏不了（Apple 文档里 status-bar-style 只有 default / black / black-translucent 三种，没有隐藏）；
   横屏时 iPhone 本来就不显示状态栏——所以要满屏，就得关掉竖排方向锁定、把手机真的横过来 */
const canFS = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function toggleFullscreen() {
    const d = document, on = d.fullscreenElement || d.webkitFullscreenElement;
    try {
        const p = on ? (d.exitFullscreen || d.webkitExitFullscreen).call(d)
            : (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen).call(d.documentElement);
        if (p && p.catch) p.catch(() => {});
    } catch (e) {}
}
$('btn-fs').style.display = canFS ? '' : 'none';
$('btn-fs').addEventListener('click', () => { closeSheet(); toggleFullscreen(); });
// 双击留给「切白天/夜间」（用户 2026-10-26 要的），全屏改用 F 键或设置里的按钮
document.addEventListener('keydown', e => { if ((e.key === 'f' || e.key === 'F') && canFS && !sheetOpen()) toggleFullscreen(); });
const isIOS = /iP(hone|od|ad)/.test(navigator.platform) || (navigator.userAgent.includes('Mac') && navigator.maxTouchPoints > 1) || /iPhone|iPod/.test(navigator.userAgent);
function entryHint() {
    if (params.has('t')) return;
    if (view.rot && isIOS && !canFS) hint('竖屏时网页藏不掉状态栏：关掉「竖排方向锁定」把手机横过来，就是满屏', 6000);
    else if (canFS && matchMedia('(pointer: fine)').matches) hint('按 F 全屏；双击切换白天 / 夜间；长按（或回车）：设置 / 退出', 4000);
    else hint('左右滑切换，上下滑换样式；双击切白天 / 夜间；长按：设置', 3500);
}

/* ================= 屏幕常亮：这页本来就是放着看的 ================= */
let wakeLock = null;
async function keepAwake() {
    if (!('wakeLock' in navigator) || wakeLock || document.visibilityState !== 'visible') return;
    try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) { wakeLock = null; }
}
['click', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, keepAwake, true));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); refresh(); } });
window.addEventListener('pageshow', refresh);

/* ================= 启动 ================= */
if (params.get('freeze') === '1') board.classList.add('freeze');
refresh();
scheduleMinute();
keepAwake();
weather.load(false);
onFit.push(refresh);   // 屏幕尺寸变了：日光的光晕中心等按核心区位置重算
entryHint();
// 诊断：地址加 ?debug，左上角显示这台设备实际挑中的字宽档、漂浮的字距校准、画板尺寸——真机字形不对时截这张图就能看出原因
if (params.has('debug')) {
    const fam = SANS, n0 = (w, cap) => { const k = ink('1', `${w} 100px ${fam}`), sz = cap / ((k.b - k.t) / 100), g = ink('0', `${w} ${sz}px ${fam}`); return g.r - g.l; };
    const dg = pickStretch(700, fam, DIGITAL_W[0] / n0(700, 282)), so = pickStretch(500, fam, SOLAR_W[0] / n0(500, 148));
    const tries = ['37.5%', '50%', '62.5%', '75%', '87.5%', '112.5%', '125%', '150%'].map(c => c + '→' + stretchRatio(700, fam, c).toFixed(2)).join(' ');
    const box = el('div', '', document.body, 'position:fixed;left:8px;top:8px;z-index:99;background:rgba(0,0,0,.8);color:#0f0;font:11px/1.4 monospace;padding:6px;white-space:pre;pointer-events:none');
    box.textContent = `数字 选 ${dg.stretch}（比 ${dg.ratio.toFixed(2)}）  日光 选 ${so.stretch}（比 ${so.ratio.toFixed(2)}）\n各档实测字宽比：${tries}\n漂浮校准 ${JSON.stringify(calibrateFloat())}\nview ${JSON.stringify(view)}\nUA ${navigator.userAgent}`;
}
window.__sb = { pagers: { hPager, facePager, stackLPager, stackRPager }, refresh, lunarText, sunPos, MAKEUP_WORKDAYS, view, FACE_ORDER, openSheet, closeSheet, pickStretch, calibrateFloat };
</script>
</body>
</html>
